[package]
name = "ladx-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "LADX Studio: local-first PLC AI agent for Windows"

[lib]
name = "ladx_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
base64 = "0.22"
tauri-plugin-opener = "2.0"
tauri-plugin-dialog = "2.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
futures-util = "0.3"
ladx-types = { workspace = true }
ladx-inference = { workspace = true }
ladx-audit = { workspace = true }
ladx-parsers = { workspace = true }
ladx-validator = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
