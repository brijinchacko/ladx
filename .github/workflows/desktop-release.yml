# Building LADX Studio for Windows and macOS.
#
# Built on the target rather than cross compiled. A signed and notarised macOS
# app cannot be produced from Linux, and attempting it wastes a day before you
# find that out.
#
# Signing is off until the certificates exist. The build runs and produces
# installers either way, which is the point: the pipeline is proved first and
# the certificates are dropped in when they are bought. An unsigned installer is
# fine for internal testing and is not fine for a customer, so the release step
# says which it is.
#
# See docs/adr/0004-desktop-app-windows-and-mac.md.

name: Desktop release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "alpha, beta or stable"
        required: true
        default: alpha
        type: choice
        options: [alpha, beta, stable]
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      # Every platform runs even when one fails, so a Windows problem does not
      # hide a macOS one and cost a second round trip.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # One download for Intel and Apple Silicon. Two is a support
            # question we should not create.
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    # The action creates the draft release, and the default token is read only.
    # Without this it builds both installers and then fails on the last step
    # with "Resource not accessible by integration", which reads like a
    # permissions problem with the repository rather than with the workflow.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # No version pinned here on purpose. package.json's packageManager field
      # is the one source of truth, and naming a version in both makes the
      # action refuse to start rather than pick one.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both halves of the universal binary, on macOS only.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      # The shared packages are the desktop app, so their tests are its tests.
      - run: pnpm test

      # Signing is deliberately not configured. See ADR 0004: the decision is to
      # ship unsigned to named early customers, with a certificate bought before
      # any public release.
      #
      # The variables are absent rather than wired to secrets that do not exist
      # yet. A missing secret expands to an empty string, the variable is still
      # set, and Tauri reads "set" as "sign": the macOS build got as far as
      # linking and then died on "failed to import keychain certificate", which
      # says nothing about the actual cause. When the certificates are bought,
      # add these back:
      #
      #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      #   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
      #
      # An unsigned macOS app is one Gatekeeper refuses to open until the person
      # right clicks and chooses Open, and an unsigned Windows installer raises
      # SmartScreen. Both are stated on the download page rather than left for
      # the operating system to deliver.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Update signing. Separate from code signing above and not optional:
          # the app carries the matching public key and refuses a package that
          # is not signed with this, which is what stops the update endpoint
          # becoming a way to hand somebody a different program. Without these
          # the build still produces installers, but no .sig files and no
          # latest.json, so nothing can update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: "LADX Studio __VERSION__"
          releaseBody: |
            Runs entirely on this machine. Inference is a local Ollama model.

            Windows: the .msi installer.
            macOS: the .dmg, Intel and Apple Silicon in one download.

            Not code signed yet, so both will warn on first run. On macOS,
            right click the app and choose Open.

            Updates are signed separately and are off until switched on in
            Settings.
          # Drafted rather than published, so somebody looks at the artefacts
          # before anybody downloads them.
          releaseDraft: true
          prerelease: ${{ github.event.inputs.channel != 'stable' }}
          args: ${{ matrix.args }}
