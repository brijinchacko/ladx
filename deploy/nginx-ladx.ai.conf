# ladx.ai
# Next.js (apps/web) via PM2 process 'ladx-web' on 127.0.0.1:3020.

server {
    listen 80;
    listen [::]:80;
    server_name ladx.ai www.ladx.ai;

    # Kept above the redirect so certbot renewal keeps working.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ladx.ai$request_uri;
    }
}

# www to apex, so there is one canonical host for search and for answer engines.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ladx.ai;

    ssl_certificate /etc/letsencrypt/live/ladx.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ladx.ai/privkey.pem;

    return 301 https://ladx.ai$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ladx.ai;

    ssl_certificate /etc/letsencrypt/live/ladx.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ladx.ai/privkey.pem;

    # PLC project uploads are the large ones here.
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Content-hashed by the build, so it can be cached hard and forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Token streaming. Buffering here is the difference between text appearing
    # as it is generated and the whole reply landing at once after a long wait,
    # so it is off for this location only.
    # Knowledge answers stream the same way chat does, and it also sends its
    # source list as the first frame, so buffering here would hold back the
    # citations until the whole answer had finished.
    location /api/knowledge/ask {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
    }

    location /api/chat {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # A long generation should not be cut off mid-answer.
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}
